baseURL                = "https://szmelc-inc.github.io/hyperland-wiki/"
title                  = "Hyperland Wiki"
enableRobotsTXT        = true
enableGitInfo          = true
defaultContentLanguage = "en"
enableInlineShortcodes = true
languageCode           = 'en-us'
pluralizeListTitles    = false
disablePathToLower     = true

[outputs]
home    = ["HTML"]
page    = ["HTML"]
section = ["HTML", "RSS"]

[module.imports]
path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

[markup.highlight]
noClasses = false

[[menu.main]]
name   = "Search"
weight = 5
[menu.main.params]
type = "search"

#[[menu.main]]
#name   = "Discord"
#weight = 6
#url    = "https://discord.gg/hyprland-cathedral-961691461554950145"
#[menu.main.params]
#icon = "discord"

[[menu.main]]
name   = "GitHub"
weight = 7
url    = "https://github.com/Szmelc-INC/Hyperland"
[menu.main.params]
icon = "github"

[params]
description        = "The documentation for Hyperland, an independent fork of Hyprland 0.54."
displayUpdatedDate = true
dateFormat         = "January 2, 2006"
keywords           = ["hyperland", "hyprland", "wiki", "wayland", "compositor"]

[params.version]
name       = "Hyperland 0.54"
url        = "/version-selector/"
outdated   = false  # set for any version that isn't the current one
version    = ""     # only change when setting the version, otherwise it is "Latest git" by default

[params.navbar]
displayTitle = true
displayLogo  = true
width        = "full"

[params.navbar.logo]
path = "favicon.svg"
dark = "favicon-dark.svg"

[params.page]
width = "full"

[params.theme]
default       = "system"
displayToggle = true

[params.footer]
enable           = false
displayCopyright = true
displayPoweredBy = true
width            = "normal"

[params.search]
enable = true
type   = "flexsearch"

[params.search.flexsearch]
index = "content"

[params.editURL]
enable = true
base   = "https://github.com/Szmelc-INC/hyperland-wiki/edit/main/content/"

[params.blog.list]
displayTags = true

[params.comments]
enable = false
